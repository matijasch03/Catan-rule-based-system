<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catan Board</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Catan Board</h1>
        <div class="actions">
            <button id="newgame-btn" type="button">New Game</button>
            <button id="reload-btn" type="button">Reload</button>
        </div>
    </header>

    <main>
        <div class="board-wrap">
            <div id="board" class="board"></div>

            <section class="hand">
                <h2>Your hand</h2>
                <div id="hand-cards" class="hand-cards"></div>
            </section>
        </div>

        <aside class="panel">
            <h2>Players</h2>
            <ul id="players" class="players"></ul>

            <h2>Pieces</h2>
            <ul class="legend">
                <li><span class="swatch piece-village"></span> Village</li>
                <li><span class="swatch piece-road"></span> Road</li>
                <li><span class="swatch piece-town"></span> Town</li>
            </ul>

            <h2>Turn</h2>
            <p id="status" class="status"></p>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
